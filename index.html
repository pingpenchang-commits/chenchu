<!DOCTYPE html>

<html lang="zh-TW">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>分享電子名片</title>

<!-- LINE LIFF SDK -->
<script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
</script>
```

</head>

<body>

<div style="
    text-align:center;
    margin-top:50px;
    font-family:sans-serif;
">

```
<h2>正在開啟 LINE 分享...</h2>

<p id="status">
    請稍候
</p>
```

</div>

<script>

/*
 * =========================================================
 * LIFF ID
 * =========================================================
 */

const LIFF_ID = "2011256691-zF9c9pjc";


/*
 * =========================================================
 * LINE FLEX MESSAGE
 *
 * 第二份 JSON 已整合到第一份 LIFF 程式
 *
 * 王俊騰／宸浚企業社
 * =========================================================
 */

const flexMessage = {

    type: "flex",

    altText: "王俊騰｜宸浚企業社｜電子名片",

    contents: {

        type: "bubble",


        /*
         * =====================================================
         * HERO
         * =====================================================
         */

        hero: {

            type: "image",

            url:
                "https://i.ibb.co/qMZQw2rB/logo.jpg",

            size: "full",

            aspectRatio: "60:11",

            aspectMode: "cover"

        },


        /*
         * =====================================================
         * BODY
         * =====================================================
         */

        body: {

            type: "box",

            layout: "vertical",

            spacing: "md",

            contents: [


                /*
                 * =================================================
                 * 姓名
                 * =================================================
                 */

                {

                    type: "box",

                    layout: "vertical",

                    contents: [

                        {

                            type: "text",

                            text: "王俊騰",

                            size: "xxl",

                            weight: "bold",

                            align: "center",

                            gravity: "center",

                            color: "#000000"

                        }

                    ],

                    height: "70px",

                    justifyContent: "center"

                },


                /*
                 * =================================================
                 * 公司資訊
                 * =================================================
                 */

                {

                    type: "box",

                    layout: "vertical",

                    backgroundColor: "#CCEEFF",

                    cornerRadius: "md",

                    paddingAll: "12px",

                    spacing: "sm",

                    contents: [


                        /*
                         * -------------------------------------------------
                         * 公司 Logo + 公司名稱
                         * -------------------------------------------------
                         */

                        {

                            type: "box",

                            layout: "horizontal",

                            alignItems: "center",

                            contents: [

                                {

                                    type: "image",

                                    url:
                                        "https://i.ibb.co/zWpPKR2w/SUNCUE.png",

                                    size: "xs",

                                    aspectMode: "fit",

                                    flex: 0

                                },

                                {

                                    type: "text",

                                    text: "宸浚企業社",

                                    size: "md",

                                    weight: "bold",

                                    gravity: "center",

                                    margin: "sm",

                                    flex: 1

                                }

                            ]

                        },


                        /*
                         * -------------------------------------------------
                         * 分隔線
                         * -------------------------------------------------
                         */

                        {

                            type: "separator",

                            color: "#FFFFFF",

                            margin: "xs"

                        },


                        /*
                         * -------------------------------------------------
                         * 手機
                         * -------------------------------------------------
                         */

                        {

                            type: "text",

                            text:
                                "電話：0988-102039",

                            weight: "bold",

                            color: "#000000",

                            action: {

                                type: "uri",

                                label: "撥打電話",

                                uri:
                                    "tel:0988102039"

                            }

                        },


                        /*
                         * -------------------------------------------------
                         * 潭子店
                         * -------------------------------------------------
                         */

                        {

                            type: "text",

                            text:
                                "市話：04-25335439（潭子店）",

                            weight: "bold",

                            color: "#000000",

                            action: {

                                type: "uri",

                                label: "撥打潭子店電話",

                                uri:
                                    "tel:0425335439"

                            }

                        },


                        /*
                         * -------------------------------------------------
                         * 后里店
                         * -------------------------------------------------
                         */

                        {

                            type: "text",

                            text:
                                "市話：04-25573968（后里店）",

                            weight: "bold",

                            color: "#000000",

                            action: {

                                type: "uri",

                                label: "撥打后里店電話",

                                uri:
                                    "tel:0425573968"

                            }

                        }

                    ]

                },


                /*
                 * =================================================
                 * 聯絡按鈕
                 * =================================================
                 */

                {

                    type: "box",

                    layout: "horizontal",

                    spacing: "sm",

                    margin: "md",

                    contents: [


                        /*
                         * 加 LINE
                         */

                        {

                            type: "button",

                            style: "primary",

                            color: "#0044BB",

                            action: {

                                type: "uri",

                                label: "加 LINE 聯繫",

                                uri:
                                    "https://line.me/ti/p/KGjehjx9ge"

                            },

                            flex: 1

                        },


                        /*
                         * 官方網站
                         */

                        {

                            type: "button",

                            style: "primary",

                            color: "#003C9D",

                            action: {

                                type: "uri",

                                label: "官方網站",

                                uri:
                                    "https://reurl.cc/6X98lk"

                            },

                            flex: 1

                        }

                    ]

                }

            ]

        },


        /*
         * =====================================================
         * FOOTER
         * =====================================================
         */

        footer: {

            type: "box",

            layout: "horizontal",

            spacing: "md",

            paddingTop: "sm",

            contents: [


                /*
                 * =================================================
                 * Facebook
                 * =================================================
                 */

                {

                    type: "box",

                    layout: "vertical",

                    flex: 1,

                    justifyContent: "center",

                    contents: [

                        {

                            type: "image",

                            url:
                                "https://i.ibb.co/Q3GkgjcX/facboo1.png",

                            size: "xs",

                            aspectMode: "fit",

                            aspectRatio: "1:1",

                            action: {

                                type: "uri",

                                label: "Facebook",

                                uri:
                                    "https://reurl.cc/6X98lk"

                            }

                        }

                    ]

                },


                /*
                 * =================================================
                 * 分享
                 * =================================================
                 */

                {

                    type: "box",

                    layout: "horizontal",

                    flex: 1,

                    justifyContent: "center",

                    alignItems: "center",

                    action: {

                        type: "uri",

                        label: "分享",

                        uri:
                            "https://liff.line.me/2011256691-zF9c9pjc"

                    },

                    contents: [

                        {

                            type: "image",

                            url:
                                "https://i.ibb.co/3YPf9FMZ/share.png",

                            size: "xxs",

                            aspectMode: "fit",

                            flex: 0

                        },

                        {

                            type: "text",

                            text: "分享",

                            size: "sm",

                            weight: "bold",

                            gravity: "center",

                            margin: "xs"

                        }

                    ]

                },


                /*
                 * =================================================
                 * SUNCUE LOGO
                 * =================================================
                 */

                {

                    type: "box",

                    layout: "vertical",

                    flex: 1,

                    justifyContent: "center",

                    alignItems: "flex-end",

                    contents: [

                        {

                            type: "image",

                            url:
                                "https://i.ibb.co/zWpPKR2w/SUNCUE.png",

                            size: "md",

                            aspectMode: "fit",

                            action: {

                                type: "uri",

                                label:
                                    "SUNCUE 官方網站",

                                uri:
                                    "https://www.suncue.tw/"

                            }

                        }

                    ]

                }

            ]

        },


        /*
         * =====================================================
         * FOOTER STYLE
         * =====================================================
         */

        styles: {

            footer: {

                separator: true,

                separatorColor: "#DDDDDD"

            }

        }

    }

};


/*
 * =========================================================
 * 初始化 LIFF
 * =========================================================
 */

liff.init({

    liffId: LIFF_ID

})


.then(() => {


    console.log(
        "LIFF 初始化成功"
    );


    document.getElementById(
        "status"
    ).innerText =
        "正在開啟分享對象選擇器...";


    /*
     * =====================================================
     * 檢查 LINE 登入狀態
     * =====================================================
     */

    if (!liff.isLoggedIn()) {

        liff.login();

        return null;

    }


    /*
     * =====================================================
     * 開啟 LINE 分享對象選擇器
     * =====================================================
 */

    return liff.shareTargetPicker([

        flexMessage

    ]);

})


.then((result) => {


    /*
     * =====================================================
     * 如果剛才執行 liff.login()
     * =====================================================
     */

    if (result === null) {

        return;

    }


    /*
     * =====================================================
     * 使用者取消分享
     * =====================================================
     */

    if (!result) {

        console.log(
            "使用者取消分享"
        );


        document.getElementById(
            "status"
        ).innerText =
            "已取消分享";

        return;

    }


    /*
     * =====================================================
     * 分享成功
     * =====================================================
     */

    console.log(
        "分享成功",
        result
    );


    document.getElementById(
        "status"
    ).innerText =
        "分享成功！";


    /*
     * =====================================================
     * 分享完成後關閉 LIFF
     * =====================================================
 */

    setTimeout(() => {


        if (liff.isInClient()) {

            liff.closeWindow();

        }


    }, 800);

})


.catch((error) => {


    /*
     * =====================================================
     * 錯誤處理
     * =====================================================
 */

    console.error(

        "LIFF 錯誤:",

        error

    );


    document.getElementById(
        "status"
    ).innerText =
        "發生錯誤，請查看 Console";


    alert(

        "LINE 分享發生錯誤：\n\n" +

        (

            error.message ||

            error

        )

    );

});

</script>

</body>

</html>
